name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, asset: sdd-darwin-amd64}
          - {goos: darwin, goarch: arm64, asset: sdd-darwin-arm64}
          - {goos: linux, goarch: amd64, asset: sdd-linux-amd64}
          - {goos: linux, goarch: arm64, asset: sdd-linux-arm64}
          - {goos: windows, goarch: amd64, asset: sdd-windows-amd64.exe}
          - {goos: windows, goarch: arm64, asset: sdd-windows-arm64.exe}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-X github.com/remussoare/sdd-cook/internal/version.Version=${{ github.ref_name }}" \
            -o "${{ matrix.asset }}" ./cmd/sdd
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
